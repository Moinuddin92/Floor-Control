<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Floor Control — Production Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #14171a;
    --panel: #1c2024;
    --panel-raised: #232830;
    --border: #2e3439;
    --text: #e9e7e1;
    --text-dim: #8b9198;
    --text-faint: #5b6168;
    --amber: #ffb020;
    --amber-dim: #7a5a1e;
    --blue: #4d8dff;
    --green: #3ec96a;
    --red: #ff5d5d;
    --gray: #6b7280;
    --radius: 3px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --display: 'Space Grotesk', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  ::selection { background: var(--amber-dim); }

  /* ---- App shell ---- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); padding: 20px 0;
    display: flex; flex-direction: column;
  }
  .brand {
    padding: 0 20px 20px; margin-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .brand-mark { display: flex; align-items: center; gap: 8px; }
  .brand-chip {
    width: 10px; height: 22px; background: repeating-linear-gradient(
      to bottom, var(--amber) 0px, var(--amber) 3px, transparent 3px, transparent 6px
    );
  }
  .brand-title { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .brand-sub { font-family: var(--mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; margin-top: 2px; text-transform: uppercase; }

  .nav { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer; font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
    border-left: 2px solid transparent; transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--panel-raised); color: var(--text); }
  .nav-item.active { background: var(--panel-raised); color: var(--amber); border-left-color: var(--amber); }
  .nav-num { font-family: var(--mono); font-size: 10px; color: var(--text-faint); width: 16px; }
  .nav-item.active .nav-num { color: var(--amber); }

  .sidebar-foot { margin-top: auto; padding: 14px 20px 4px; border-top: 1px solid var(--border); }
  .conn-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; box-shadow: 0 0 6px var(--green); }
  .conn-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }

  .main { flex: 1; padding: 28px 36px 60px; max-width: 1180px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .page-title { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .page-desc { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

  /* ---- Buttons ---- */
  .btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em;
    padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel-raised); color: var(--text); cursor: pointer; transition: all .12s;
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn-amber { background: var(--amber); color: #1a1300; border-color: var(--amber); }
  .btn-amber:hover { background: #ffc24d; }
  .btn-ghost { background: transparent; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-danger { color: var(--red); border-color: #4a2a2a; }

  /* ---- Cards / table ---- */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  select, input, textarea {
    background: var(--panel-raised); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: var(--radius); font-family: var(--sans); font-size: 12.5px;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--amber); }
  label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

  /* Batch traveler card */
  .batch-card {
    display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 10px; overflow: hidden;
  }
  .batch-stripe { width: 10px; background: repeating-linear-gradient(to bottom, var(--stripe-color, var(--gray)) 0, var(--stripe-color, var(--gray)) 4px, transparent 4px, transparent 8px); flex-shrink: 0; }
  .batch-body { flex: 1; padding: 14px 18px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .batch-code { font-family: var(--mono); font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em; }
  .batch-meta { font-size: 12px; color: var(--text-dim); }
  .batch-meta b { color: var(--text); font-weight: 500; }
  .badge {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 8px; border-radius: 20px; border: 1px solid currentColor;
  }
  .stat-row { display: flex; gap: 18px; font-size: 12px; color: var(--text-dim); }
  .stat-row b { color: var(--text); font-family: var(--mono); }
  .batch-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: var(--mono); }
  .dim { color: var(--text-dim); }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--panel-raised); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: var(--radius); font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    display: none; max-width: 340px;
  }
  .toast.show { display: block; }
  .toast.err { border-color: #5a2c2c; color: #ffb3b3; }
  .toast.ok { border-color: #2c5a3a; color: #a8f0c0; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 40;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); width: 420px; max-width: 90vw; padding: 22px; }
  .modal-title { font-family: var(--display); font-weight: 700; font-size: 15px; margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .section-title { font-family: var(--display); font-size: 13.5px; font-weight: 600; margin: 26px 0 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 3px; height: 13px; background: var(--amber); display: inline-block; }

  .tab-row { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 14px; font-size: 12.5px; font-weight: 500; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--amber); border-bottom-color: var(--amber); }

  .kpi-row { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; min-width: 130px; }
  .kpi-val { font-family: var(--display); font-size: 24px; font-weight: 700; }
  .kpi-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  /* ---- Dashboard ---- */
  .dash-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  .dash-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .dash-panel-title { font-family: var(--display); font-size: 12.5px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .dash-panel-title span.hint { font-family: var(--sans); font-weight: 400; font-size: 11px; color: var(--text-faint); }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 130px; font-size: 11.5px; color: var(--text-dim); flex-shrink: 0; }
  .bar-track { flex: 1; height: 10px; background: var(--panel-raised); border-radius: 20px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 20px; transition: width .4s; }
  .bar-val { width: 54px; text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--text); flex-shrink: 0; }

  .yield-ring-wrap { display: flex; align-items: center; gap: 20px; }
  .yield-num { font-family: var(--display); font-size: 34px; font-weight: 700; }
  .yield-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .perf-table th, .perf-table td { padding: 8px 10px; }
  .mini-bar { display: inline-block; height: 6px; border-radius: 10px; background: var(--blue); vertical-align: middle; margin-right: 6px; }

  @media (max-width: 800px) {
    .dash-grid { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 20px; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-chip"></div>
        <div>
          <div class="brand-title">FLOOR CONTROL</div>
          <div class="brand-sub">Production Tracking</div>
        </div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      <span class="conn-dot"></span><span class="conn-label" id="connLabel">supabase connected</span>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://wvhtqthnuriobmsixpzb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2aHRxdGhudXJpb2Jtc2l4cHpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjE2MTQsImV4cCI6MjEwMzIzNzYxNH0.TRD76b3DX9rF0f4-elzJpBpvZqTyNtzJi8e0w6qglVI';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ------------------------------------------------------------------
// State
// ------------------------------------------------------------------
let state = {
  route: 'dashboard',
  users: [], lines: [], products: [], batches: [], downtime: [], defects: [],
  filterStatus: 'all', filterLine: 'all',
};

const STATUS_COLOR = {
  'Not Started': 'var(--gray)',
  'In Progress': 'var(--blue)',
  'Paused': 'var(--amber)',
  'Completed': 'var(--green)',
  'On Hold (QA)': 'var(--red)',
};

const NEXT_ACTIONS = {
  'Not Started': [{ label: 'Start', to: 'In Progress' }],
  'In Progress': [{ label: 'Pause', to: 'Paused' }, { label: 'Complete', to: 'Completed' }, { label: 'QA Hold', to: 'On Hold (QA)' }],
  'Paused': [{ label: 'Resume', to: 'In Progress' }],
  'Completed': [{ label: 'QA Hold', to: 'On Hold (QA)' }],
  'On Hold (QA)': [{ label: 'Release → Complete', to: 'Completed' }, { label: 'Release → Resume', to: 'In Progress' }],
};

const NAV = [
  { id: 'dashboard', label: 'Dashboard', num: '00' },
  { id: 'batches', label: 'Batches', num: '01' },
  { id: 'newbatch', label: 'New Batch', num: '02' },
  { id: 'downtime', label: 'Downtime Log', num: '03' },
  { id: 'defects', label: 'Defect Log', num: '04' },
  { id: 'masters', label: 'Setup', num: '05' },
];

// ------------------------------------------------------------------
// Toast
// ------------------------------------------------------------------
function toast(msg, kind = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + kind;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 3800);
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ------------------------------------------------------------------
// Data loading
// ------------------------------------------------------------------
async function loadAll() {
  const [u, l, p, b, dt, df] = await Promise.all([
    sb.from('app_users').select('*').order('name'),
    sb.from('lines').select('*').order('line_code'),
    sb.from('products').select('*').order('sku'),
    sb.from('batches').select('*').order('created_at', { ascending: false }),
    sb.from('downtime_events').select('*').order('start_time', { ascending: false }),
    sb.from('defect_log').select('*').order('occurred_at', { ascending: false }),
  ]);
  for (const [name, res] of [['users', u], ['lines', l], ['products', p], ['batches', b], ['downtime', dt], ['defects', df]]) {
    if (res.error) { toast(`Load failed (${name}): ${res.error.message}`, 'err'); state[name] = []; }
    else state[name] = res.data;
  }
  render();
}

function lineName(id) { const l = state.lines.find(x => x.id === id); return l ? l.line_code : '—'; }
function productSku(id) { const p = state.products.find(x => x.id === id); return p ? p.sku : '—'; }
function userName(id) { const u = state.users.find(x => x.id === id); return u ? u.name : '—'; }
function batchCode(id) { const b = state.batches.find(x => x.id === id); return b ? b.batch_code : '—'; }

// ------------------------------------------------------------------
// Nav + shell render
// ------------------------------------------------------------------
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(item => `
    <div class="nav-item ${state.route === item.id ? 'active' : ''}" data-route="${item.id}">
      <span class="nav-num">${item.num}</span>${item.label}
    </div>`).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => { state.route = el.dataset.route; render(); });
  });
}

function render() {
  renderNav();
  const main = document.getElementById('main');
  if (state.route === 'dashboard') main.innerHTML = viewDashboard();
  else if (state.route === 'batches') main.innerHTML = viewBatches();
  else if (state.route === 'newbatch') main.innerHTML = viewNewBatch();
  else if (state.route === 'downtime') main.innerHTML = viewDowntime();
  else if (state.route === 'defects') main.innerHTML = viewDefects();
  else if (state.route === 'masters') main.innerHTML = viewMasters();
  attachHandlers();
}

// ------------------------------------------------------------------
// VIEW: Dashboard
// ------------------------------------------------------------------
function viewDashboard() {
  const b = state.batches;
  const totalBatches = b.length;
  const statusCounts = {};
  ['Not Started', 'In Progress', 'Paused', 'Completed', 'On Hold (QA)'].forEach(s => statusCounts[s] = 0);
  b.forEach(x => statusCounts[x.status] = (statusCounts[x.status] || 0) + 1);

  const totalGood = b.reduce((s, x) => s + (x.good_quantity || 0), 0);
  const totalReject = b.reduce((s, x) => s + (x.defect_reject_quantity || 0), 0);
  const totalActual = totalGood + totalReject;
  const totalPlanned = b.reduce((s, x) => s + (x.planned_quantity || 0), 0);
  const yieldPct = totalActual > 0 ? Math.round((totalGood / totalActual) * 1000) / 10 : null;
  const attainmentPct = totalPlanned > 0 ? Math.round((totalActual / totalPlanned) * 1000) / 10 : null;

  const totalDowntimeMin = state.downtime.reduce((s, d) => s + (d.duration_minutes || 0), 0);
  const openDowntime = state.downtime.filter(d => !d.end_time).length;

  // Downtime by reason
  const dtByReason = {};
  state.downtime.forEach(d => { dtByReason[d.downtime_reason] = (dtByReason[d.downtime_reason] || 0) + (d.duration_minutes || 0); });
  const maxDt = Math.max(1, ...Object.values(dtByReason));

  // Defects by reason (quantity)
  const defByReason = {};
  state.defects.forEach(d => { defByReason[d.defect_reason_code] = (defByReason[d.defect_reason_code] || 0) + (d.quantity || 0); });
  const maxDef = Math.max(1, ...Object.values(defByReason), totalReject);

  // Per-line performance
  const perLine = state.lines.map(l => {
    const lb = b.filter(x => x.line_id === l.id);
    const good = lb.reduce((s, x) => s + (x.good_quantity || 0), 0);
    const reject = lb.reduce((s, x) => s + (x.defect_reject_quantity || 0), 0);
    const actual = good + reject;
    const ldt = state.downtime.filter(d => lb.some(x => x.id === d.batch_id)).reduce((s, d) => s + (d.duration_minutes || 0), 0);
    return { code: l.line_code, name: l.line_name, batches: lb.length, yieldPct: actual > 0 ? Math.round((good / actual) * 1000) / 10 : null, downtime: Math.round(ldt) };
  }).filter(l => l.batches > 0);
  const maxLineBatches = Math.max(1, ...perLine.map(l => l.batches));

  const statusBars = Object.entries(statusCounts).map(([s, c]) => `
    <div class="bar-row">
      <div class="bar-label">${s}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${totalBatches ? (c / totalBatches) * 100 : 0}%; background:${STATUS_COLOR[s]}"></div></div>
      <div class="bar-val">${c}</div>
    </div>
  `).join('');

  const dtBars = Object.keys(dtByReason).length ? Object.entries(dtByReason).sort((a,b2)=>b2[1]-a[1]).map(([r, mins]) => `
    <div class="bar-row">
      <div class="bar-label">${r}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(mins / maxDt) * 100}%; background:var(--red)"></div></div>
      <div class="bar-val">${Math.round(mins)}m</div>
    </div>
  `).join('') : `<div class="empty" style="padding:16px 0;">No downtime recorded yet.</div>`;

  const defBars = Object.keys(defByReason).length ? Object.entries(defByReason).sort((a,b2)=>b2[1]-a[1]).map(([r, qty]) => `
    <div class="bar-row">
      <div class="bar-label">${r}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(qty / maxDef) * 100}%; background:var(--amber)"></div></div>
      <div class="bar-val">${qty}</div>
    </div>
  `).join('') : `<div class="empty" style="padding:16px 0;">No defects recorded yet.</div>`;

  const lineRows = perLine.length ? perLine.map(l => `
    <tr>
      <td class="mono">${l.code}</td>
      <td class="dim">${l.name}</td>
      <td><span class="mini-bar" style="width:${(l.batches / maxLineBatches) * 40}px"></span>${l.batches}</td>
      <td class="mono">${l.yieldPct === null ? '—' : l.yieldPct + '%'}</td>
      <td class="mono">${l.downtime}m</td>
    </tr>
  `).join('') : `<tr><td colspan="5" class="empty">No batch activity on any line yet.</td></tr>`;

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-desc">Floor-wide rollup across all batches, downtime, and defects.</div>
      </div>
      <button class="btn btn-amber" data-nav="newbatch">+ New Batch</button>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val">${totalBatches}</div><div class="kpi-label">Total Batches</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--blue)">${statusCounts['In Progress']}</div><div class="kpi-label">In Progress</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--red)">${statusCounts['On Hold (QA)']}</div><div class="kpi-label">On QA Hold</div></div>
      <div class="kpi"><div class="kpi-val" style="color:${openDowntime ? 'var(--amber)' : 'var(--text)'}">${openDowntime}</div><div class="kpi-label">Open Downtime</div></div>
      <div class="kpi"><div class="kpi-val">${Math.round(totalDowntimeMin)}<span style="font-size:13px;color:var(--text-faint)">m</span></div><div class="kpi-label">Total Downtime</div></div>
    </div>

    <div class="dash-grid">
      <div>
        <div class="dash-panel">
          <div class="dash-panel-title">Batches by Status</div>
          ${statusBars}
        </div>
        <div class="dash-panel">
          <div class="dash-panel-title">Line Performance <span class="hint">yield = good / (good + reject)</span></div>
          <table class="perf-table">
            <thead><tr><th>Line</th><th>Name</th><th>Batches</th><th>Yield</th><th>Downtime</th></tr></thead>
            <tbody>${lineRows}</tbody>
          </table>
        </div>
      </div>
      <div>
        <div class="dash-panel">
          <div class="dash-panel-title">Yield</div>
          <div class="yield-ring-wrap">
            <div>

async function createBatch() {
  const productId = document.getElementById('nb_product').value;
  const lineSel = document.getElementById('nb_line');
  const lineId = lineSel.value;
  const lineCode = lineSel.selectedOptions[0].dataset.code;
  const shift = document.getElementById('nb_shift').value;
  const supervisorId = document.getElementById('nb_supervisor').value;
  const planned = Number(document.getElementById('nb_planned').value) || 0;
  const entryMethod = document.getElementById('nb_entry').value;
  const notes = document.getElementById('nb_notes').value;

  const today = new Date();
  const ymd = today.toISOString().slice(0, 10).replace(/-/g, '');
  const shiftLetter = shift[0];

  const { count } = await sb.from('batches').select('*', { count: 'exact', head: true })
    .eq('line_id', lineId).eq('shift', shift)
    .gte('created_at', `${today.toISOString().slice(0,10)}T00:00:00Z`);
  const seq = String((count || 0) + 1).padStart(3, '0');
  const batchCode = `${lineCode}-${shiftLetter}-${ymd}-${seq}`;

  const { error } = await sb.from('batches').insert({
    batch_code: batchCode,
    product_id: productId,
    line_id: lineId,
    shift,
    planned_quantity: planned,
    assigned_supervisor_id: supervisorId,
    entry_method: entryMethod,
    notes,
  });

  if (error) { toast('Create failed: ' + error.message, 'err'); return; }
  toast(`Batch ${batchCode} created.`);
  state.route = 'batches';
  await loadAll();
}

async function updateStatus(id, to) {
  const payload = { status: to };
  const batch = state.batches.find(b => b.id === id);
  if (to === 'In Progress' && batch.status === 'Not Started' && !batch.start_timestamp) {
    payload.start_timestamp = new Date().toISOString();
  }
  const { error } = await sb.from('batches').update(payload).eq('id', id);
  if (error) { toast('Status update failed: ' + error.message, 'err'); return; }
  toast(`Batch → ${to}`);
  await loadAll();
}

async function logDowntimeStart() {

    .eq('batch_id', batchId).is('end_time', null);

  const { error } = await sb.from('downtime_events').insert({

  });
  if (error) { toast('Log failed: ' + error.message, 'err'); return; }
  toast('Downtime started.');
  await loadAll();

async function logDefect() {
  const batchId = document.getElementById('df_batch').value;
  const reason = document.getElementById('df_reason').value;
  const qty = Number(document.getElementById('df_qty').value) || 0;
  const loggedBy = document.getElementById('df_user').value;
  const notes = document.getElementById('df_notes').value;
  if (!batchId || !loggedBy || qty <= 0) { toast('Select batch, user, and a quantity > 0.', 'err'); return; }

  const { error: e1 } = await sb.from('defect_log').insert({
    batch_id: batchId, defect_reason_code: reason, quantity: qty, logged_by: loggedBy, notes,
  });
  if (e1) { toast('Log failed: ' + e1.message, 'err'); return; }

  // Roll up onto the batch totals
  const b = state.batches.find(x => x.id === batchId);
  const newReject = b.defect_reject_quantity + qty;
  const { error: e2 } = await sb.from('batches').update({
    defect_reject_quantity: newReject,
    actual_quantity_produced: b.good_quantity + newReject,
    defect_reason_code: reason,
  }).eq('id', batchId);
  if (e2) { toast('Batch rollup failed: ' + e2.message, 'err'); return; }

  toast('Defect logged.');
  await loadAll();
}

// ------------------------------------------------------------------
function attachHandlers() {
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => { state.route = el.dataset.nav; render(); }));

  const fs = document.getElementById('filterStatus');
  if (fs) fs.addEventListener('change', () => { state.filterStatus = fs.value; render(); });
  const fl = document.getElementById('filterLine');
  if (fl) fl.addEventListener('change', () => { state.filterLine = fl.value; render(); });

  document.querySelectorAll('[data-action="status"]').forEach(el =>
    el.addEventListener('click', () => updateStatus(el.dataset.id, el.dataset.to)));
  document.querySelectorAll('[data-action="editqty"]').forEach(el =>
    el.addEventListener('click', () => openQtyModal(el.dataset.id)));
  document.querySelectorAll('[data-action="closedt"]').forEach(el =>
    el.addEventListener('click', () => closeDowntime(el.dataset.id)));

  const nbSubmit = document.getElementById('nb_submit');
  if (nbSubmit) nbSubmit.addEventListener('click', createBatch);
  const dtSubmit = document.getElementById('dt_submit');
  if (dtSubmit) dtSubmit.addEventListener('click', logDowntimeStart);
  const dfSubmit = document.getElementById('df_submit');
  if (dfSubmit) dfSubmit.addEventListener('click', logDefect);

  document.querySelectorAll('[data-mtab]').forEach(el =>
    el.addEventListener('click', () => { state._mastersTab = el.dataset.mtab; render(); }));
  const pmSubmit = document.getElementById('pm_submit');
  if (pmSubmit) pmSubmit.addEventListener('click', addProduct);
  const lmSubmit = document.getElementById('lm_submit');
  if (lmSubmit) lmSubmit.addEventListener('click', addLine);
  const umSubmit = document.getElementById('um_submit');
  if (umSubmit) umSubmit.addEventListener('click', addUser);
}

// ------------------------------------------------------------------
// Boot
// ------------------------------------------------------------------
loadAll().catch(err => {
  document.getElementById('connLabel').textContent = 'connection error';
  document.querySelector('.conn-dot').style.background = 'var(--red)';
  toast('Failed to reach Supabase: ' + err.message, 'err');
});
</script>
</body>
</html>
