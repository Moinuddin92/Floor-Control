<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Floor Control — Production Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #14171a;
    --panel: #1c2024;
    --panel-raised: #232830;
    --border: #2e3439;
    --text: #e9e7e1;
    --text-dim: #8b9198;
    --text-faint: #5b6168;
    --amber: #ffb020;
    --amber-dim: #7a5a1e;
    --blue: #4d8dff;
    --green: #3ec96a;
    --red: #ff5d5d;
    --gray: #6b7280;
    --radius: 3px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --display: 'Space Grotesk', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  ::selection { background: var(--amber-dim); }

  /* ---- App shell ---- */
  .shell { display: none; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); padding: 20px 0;
    display: flex; flex-direction: column;
  }
  .brand {
    padding: 0 20px 20px; margin-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .brand-mark { display: flex; align-items: center; gap: 8px; }
  .brand-chip {
    width: 10px; height: 22px; background: repeating-linear-gradient(
      to bottom, var(--amber) 0px, var(--amber) 3px, transparent 3px, transparent 6px
    );
  }
  .brand-title { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .brand-sub { font-family: var(--mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; margin-top: 2px; text-transform: uppercase; }

  .nav { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer; font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
    border-left: 2px solid transparent; transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--panel-raised); color: var(--text); }
  .nav-item.active { background: var(--panel-raised); color: var(--amber); border-left-color: var(--amber); }
  .nav-num { font-family: var(--mono); font-size: 10px; color: var(--text-faint); width: 16px; }
  .nav-item.active .nav-num { color: var(--amber); }

  .sidebar-foot { margin-top: auto; padding: 14px 20px 4px; border-top: 1px solid var(--border); }
  .conn-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; box-shadow: 0 0 6px var(--green); }
  .conn-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }

  .main { flex: 1; padding: 28px 36px 60px; max-width: 1180px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .page-title { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .page-desc { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

  /* ---- Buttons ---- */
  .btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em;
    padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel-raised); color: var(--text); cursor: pointer; transition: all .12s;
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn-amber { background: var(--amber); color: #1a1300; border-color: var(--amber); }
  .btn-amber:hover { background: #ffc24d; }
  .btn-ghost { background: transparent; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-danger { color: var(--red); border-color: #4a2a2a; }

  /* ---- Cards / table ---- */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  select, input, textarea {
    background: var(--panel-raised); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: var(--radius); font-family: var(--sans); font-size: 12.5px;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--amber); }
  label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

  /* Batch traveler card */
  .batch-card {
    display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 10px; overflow: hidden;
  }
  .batch-stripe { width: 10px; background: repeating-linear-gradient(to bottom, var(--stripe-color, var(--gray)) 0, var(--stripe-color, var(--gray)) 4px, transparent 4px, transparent 8px); flex-shrink: 0; }
  .batch-body { flex: 1; padding: 14px 18px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .batch-code { font-family: var(--mono); font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em; }
  .batch-meta { font-size: 12px; color: var(--text-dim); }
  .batch-meta b { color: var(--text); font-weight: 500; }
  .badge {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 8px; border-radius: 20px; border: 1px solid currentColor;
  }
  .stat-row { display: flex; gap: 18px; font-size: 12px; color: var(--text-dim); }
  .stat-row b { color: var(--text); font-family: var(--mono); }
  .batch-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .batch-card-clickable { cursor: pointer; transition: border-color .12s, transform .12s; }
  .batch-card-clickable:hover { border-color: var(--amber); }
  .lot-card { padding: 16px; margin-bottom: 14px; border-color: var(--amber-dim); }
  .lot-header { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  .lot-title { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--amber); }
  .lot-steps .batch-card { margin-bottom: 8px; border-style: dashed; }
  .lot-steps .batch-card:last-child { margin-bottom: 0; }
  .step-row { display: flex; align-items: center; gap: 10px; background: var(--panel-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
  .step-num { font-family: var(--mono); font-size: 11px; color: var(--text-faint); width: 20px; flex-shrink: 0; }
  .step-row select { flex: 1; }
  .step-remove { color: var(--text-faint); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
  .step-remove:hover { color: var(--red); }

  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12.5px; cursor: pointer; margin-bottom: 16px; }
  .back-link:hover { color: var(--amber); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .detail-item { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
  .detail-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .detail-value { font-size: 14px; font-weight: 500; color: var(--text); }
  .detail-value.mono { font-family: var(--mono); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: var(--mono); }
  .dim { color: var(--text-dim); }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--panel-raised); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: var(--radius); font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    display: none; max-width: 340px;
  }
  .toast.show { display: block; }
  .toast.err { border-color: #5a2c2c; color: #ffb3b3; }
  .toast.ok { border-color: #2c5a3a; color: #a8f0c0; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 40;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); width: 420px; max-width: 90vw; padding: 22px; }
  .modal-title { font-family: var(--display); font-weight: 700; font-size: 15px; margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .section-title { font-family: var(--display); font-size: 13.5px; font-weight: 600; margin: 26px 0 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 3px; height: 13px; background: var(--amber); display: inline-block; }

  .tab-row { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 14px; font-size: 12.5px; font-weight: 500; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--amber); border-bottom-color: var(--amber); }

  .kpi-row { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; min-width: 130px; }
  .kpi-val { font-family: var(--display); font-size: 24px; font-weight: 700; }
  .kpi-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  /* ---- Dashboard ---- */
  .dash-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  .dash-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .dash-panel-title { font-family: var(--display); font-size: 12.5px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .dash-panel-title span.hint { font-family: var(--sans); font-weight: 400; font-size: 11px; color: var(--text-faint); }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 130px; font-size: 11.5px; color: var(--text-dim); flex-shrink: 0; }
  .bar-track { flex: 1; height: 10px; background: var(--panel-raised); border-radius: 20px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 20px; transition: width .4s; }
  .bar-val { width: 54px; text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--text); flex-shrink: 0; }

  .yield-ring-wrap { display: flex; align-items: center; gap: 20px; }
  .yield-num { font-family: var(--display); font-size: 34px; font-weight: 700; }
  .yield-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .perf-table th, .perf-table td { padding: 8px 10px; }
  .mini-bar { display: inline-block; height: 6px; border-radius: 10px; background: var(--blue); vertical-align: middle; margin-right: 6px; }

  /* ---- Auth ---- */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 380px; max-width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 28px; }
  .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .auth-tab { padding: 8px 4px; margin-right: 16px; font-size: 13px; font-weight: 500; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .auth-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
  .auth-err { background: #2a1515; border: 1px solid #5a2c2c; color: #ffb3b3; padding: 8px 10px; border-radius: var(--radius); font-size: 12px; margin-bottom: 14px; }
  .auth-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 14px; line-height: 1.5; }

  .user-chip { display: flex; align-items: center; gap: 8px; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--amber); color: #1a1300; font-family: var(--display); font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .user-meta-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .user-meta-role { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .signout-btn { font-size: 10.5px; color: var(--text-faint); cursor: pointer; margin-top: 8px; }
  .signout-btn:hover { color: var(--red); }

  @media (max-width: 800px) {
    .dash-grid { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 20px; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-chip"></div>
        <div>
          <div class="brand-title">FLOOR CONTROL</div>
          <div class="brand-sub">Production Tracking</div>
        </div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<div class="auth-wrap" id="authWrap" style="display:none;">
  <div class="auth-card" id="authCard"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://wvhtqthnuriobmsixpzb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2aHRxdGhudXJpb2Jtc2l4cHpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjE2MTQsImV4cCI6MjEwMzIzNzYxNH0.TRD76b3DX9rF0f4-elzJpBpvZqTyNtzJi8e0w6qglVI';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ------------------------------------------------------------------
// State
// ------------------------------------------------------------------
let state = {
  route: 'dashboard',
  users: [], lines: [], products: [], batches: [], downtime: [], defects: [],
  filterStatus: 'all', filterLine: 'all',
  currentUser: null,
  authMode: 'login',
  selectedBatchId: null,
};

const STATUS_COLOR = {
  'Not Started': 'var(--gray)',
  'In Progress': 'var(--blue)',
  'Paused': 'var(--amber)',
  'Completed': 'var(--green)',
  'On Hold (QA)': 'var(--red)',
};

const NEXT_ACTIONS = {
  'Not Started': [{ label: 'Start', to: 'In Progress' }],
  'In Progress': [{ label: 'Pause', to: 'Paused' }, { label: 'Complete', to: 'Completed' }, { label: 'QA Hold', to: 'On Hold (QA)' }],
  'Paused': [{ label: 'Resume', to: 'In Progress' }],
  'Completed': [{ label: 'QA Hold', to: 'On Hold (QA)' }],
  'On Hold (QA)': [{ label: 'Release → Complete', to: 'Completed' }, { label: 'Release → Resume', to: 'In Progress' }],
};

const ROLE_OPTIONS = ['Supervisor', 'Manager', 'QA', 'Technician'];

const NAV = [
  { id: 'dashboard', label: 'Dashboard', num: '00' },
  { id: 'batches', label: 'Batches', num: '01' },
  { id: 'newbatch', label: 'New Lot', num: '02' },
  { id: 'downtime', label: 'Downtime Log', num: '03' },
  { id: 'defects', label: 'Defect Log', num: '04' },
  { id: 'masters', label: 'Setup', num: '05' },
];

// ------------------------------------------------------------------
// Toast
// ------------------------------------------------------------------
function toast(msg, kind = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + kind;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 3800);
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ------------------------------------------------------------------
// Auth
// ------------------------------------------------------------------
// Employee IDs, not emails, are how people sign in on the floor.
// Supabase Auth's password provider needs an email shape, so we
// synthesize one from the employee ID under a fixed internal domain.
function emailForEmployeeId(empId) {
  return `${empId.trim().toLowerCase()}@floorcontrol.internal`;
}

function showAuthScreen() {
  document.getElementById('authWrap').style.display = 'flex';
  document.querySelector('.shell').style.display = 'none';
  renderAuth();
}

function showApp() {
  document.getElementById('authWrap').style.display = 'none';
  document.querySelector('.shell').style.display = 'flex';
}

function renderAuth() {
  const mode = state.authMode;
  const card = document.getElementById('authCard');
  const roleOpts = ROLE_OPTIONS.map(r => `<option>${r}</option>`).join('');

  card.innerHTML = `
    <div class="auth-brand">
      <div class="brand-chip"></div>
      <div>
        <div class="brand-title">FLOOR CONTROL</div>
        <div class="brand-sub">Production Tracking</div>
      </div>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab ${mode === 'login' ? 'active' : ''}" data-authtab="login">Sign In</div>
      <div class="auth-tab ${mode === 'signup' ? 'active' : ''}" data-authtab="signup">Sign Up</div>
    </div>
    <div id="authError"></div>
    ${mode === 'login' ? `
      <div class="field"><label>Employee ID</label><input id="au_empid" style="width:100%" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="au_password" type="password" style="width:100%" autocomplete="current-password"></div>
      <button class="btn btn-amber" id="au_submit" style="width:100%">Sign In</button>
      <div class="auth-hint">First time? New employees sign up under the Sign Up tab. If your name already appears in the system (added by a manager), signing up with the same Employee ID links your login to that record.</div>
    ` : `
      <div class="field"><label>Full Name</label><input id="au_name" style="width:100%"></div>
      <div class="field"><label>Employee ID</label><input id="au_empid" style="width:100%" autocomplete="username"></div>
      <div class="field"><label>Role</label><select id="au_role" style="width:100%">${roleOpts}</select></div>
      <div class="field"><label>Password</label><input id="au_password" type="password" style="width:100%" autocomplete="new-password"></div>
      <button class="btn btn-amber" id="au_submit" style="width:100%">Create Account</button>
      <div class="auth-hint">Choose the role you actually hold on the floor — write access to some areas (Setup, master data) is restricted to Managers.</div>
    `}
  `;

  document.querySelectorAll('[data-authtab]').forEach(el =>
    el.addEventListener('click', () => { state.authMode = el.dataset.authtab; renderAuth(); }));
  document.getElementById('au_submit').addEventListener('click', mode === 'login' ? handleLogin : handleSignup);
}

function authError(msg) {
  document.getElementById('authError').innerHTML = `<div class="auth-err">${msg}</div>`;
}

async function handleLogin() {
  const empId = document.getElementById('au_empid').value.trim();
  const password = document.getElementById('au_password').value;
  if (!empId || !password) { authError('Enter your Employee ID and password.'); return; }
  const { error } = await sb.auth.signInWithPassword({ email: emailForEmployeeId(empId), password });
  if (error) { authError(error.message); return; }
  // onAuthStateChange picks up the new session and boots the app
}

async function handleSignup() {
  const name = document.getElementById('au_name').value.trim();
  const empId = document.getElementById('au_empid').value.trim();
  const role = document.getElementById('au_role').value;
  const password = document.getElementById('au_password').value;
  if (!name || !empId || !password) { authError('Fill in name, employee ID, and password.'); return; }
  if (password.length < 6) { authError('Password must be at least 6 characters.'); return; }
  const { data, error } = await sb.auth.signUp({
    email: emailForEmployeeId(empId),
    password,
    options: { data: { name, employee_id: empId, role } },
  });
  if (error) { authError(error.message); return; }
  if (data.session) return; // signed in immediately, onAuthStateChange takes over
  authError('Account created. If email confirmation is required on this project, check with your administrator — otherwise try signing in now.');
}

async function handleSignOut() {
  await sb.auth.signOut();
}

function renderSidebarFoot() {
  const foot = document.getElementById('sidebarFoot');
  const u = state.currentUser;
  if (!u) { foot.innerHTML = ''; return; }
  const initials = u.name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  foot.innerHTML = `
    <div class="user-chip">
      <div class="user-avatar">${initials}</div>
      <div>
        <div class="user-meta-name">${u.name}</div>
        <div class="user-meta-role">${u.role}</div>
      </div>
    </div>
    <div class="signout-btn" id="signOutBtn">Sign out</div>
  `;
  document.getElementById('signOutBtn').addEventListener('click', handleSignOut);
}


async function loadAll() {
  const [u, l, p, b, dt, df] = await Promise.all([
    sb.from('app_users').select('*').order('name'),
    sb.from('lines').select('*').order('line_code'),
    sb.from('products').select('*').order('sku'),
    sb.from('batches').select('*').order('created_at', { ascending: false }),
    sb.from('downtime_events').select('*').order('start_time', { ascending: false }),
    sb.from('defect_log').select('*').order('occurred_at', { ascending: false }),
  ]);
  for (const [name, res] of [['users', u], ['lines', l], ['products', p], ['batches', b], ['downtime', dt], ['defects', df]]) {
    if (res.error) { toast(`Load failed (${name}): ${res.error.message}`, 'err'); state[name] = []; }
    else state[name] = res.data;
  }
  const { data: { user: authUser } } = await sb.auth.getUser();
  state.currentUser = authUser ? state.users.find(x => x.auth_user_id === authUser.id) || null : null;
  render();
}

function lineName(id) { const l = state.lines.find(x => x.id === id); return l ? l.line_code : '—'; }
function lineFullName(id) { const l = state.lines.find(x => x.id === id); return l ? `${l.line_code} — ${l.line_name}` : '—'; }
function productSku(id) { const p = state.products.find(x => x.id === id); return p ? p.sku : '—'; }
function userName(id) { const u = state.users.find(x => x.id === id); return u ? u.name : '—'; }
function batchCode(id) { const b = state.batches.find(x => x.id === id); return b ? b.batch_code : '—'; }

// ------------------------------------------------------------------
// Nav + shell render
// ------------------------------------------------------------------
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(item => `
    <div class="nav-item ${state.route === item.id ? 'active' : ''}" data-route="${item.id}">
      <span class="nav-num">${item.num}</span>${item.label}
    </div>`).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => { state.route = el.dataset.route; render(); });
  });
}

function render() {
  renderNav();
  renderSidebarFoot();
  const main = document.getElementById('main');
  if (state.route === 'dashboard') main.innerHTML = viewDashboard();
  else if (state.route === 'batches') main.innerHTML = viewBatches();
  else if (state.route === 'batchdetail') main.innerHTML = viewBatchDetail();
  else if (state.route === 'newbatch') { main.innerHTML = viewNewBatch(); renderNewLotSteps(); }
  else if (state.route === 'downtime') main.innerHTML = viewDowntime();
  else if (state.route === 'defects') main.innerHTML = viewDefects();
  else if (state.route === 'masters') main.innerHTML = viewMasters();
  attachHandlers();
}

// ------------------------------------------------------------------
// VIEW: Dashboard
// ------------------------------------------------------------------
function viewDashboard() {
  const b = state.batches;
  const totalBatches = b.length;
  const statusCounts = {};
  ['Not Started', 'In Progress', 'Paused', 'Completed', 'On Hold (QA)'].forEach(s => statusCounts[s] = 0);
  b.forEach(x => statusCounts[x.status] = (statusCounts[x.status] || 0) + 1);

  const totalGood = b.reduce((s, x) => s + (x.good_quantity || 0), 0);
  const totalReject = b.reduce((s, x) => s + (x.defect_reject_quantity || 0), 0);
  const totalActual = totalGood + totalReject;
  const totalPlanned = b.reduce((s, x) => s + (x.planned_quantity || 0), 0);
  const yieldPct = totalActual > 0 ? Math.round((totalGood / totalActual) * 1000) / 10 : null;
  const attainmentPct = totalPlanned > 0 ? Math.round((totalActual / totalPlanned) * 1000) / 10 : null;

  const totalDowntimeMin = state.downtime.reduce((s, d) => s + (d.duration_minutes || 0), 0);
  const openDowntime = state.downtime.filter(d => !d.end_time).length;

  // Downtime by reason
  const dtByReason = {};
  state.downtime.forEach(d => { dtByReason[d.downtime_reason] = (dtByReason[d.downtime_reason] || 0) + (d.duration_minutes || 0); });
  const maxDt = Math.max(1, ...Object.values(dtByReason));

  // Defects by reason (quantity)
  const defByReason = {};
  state.defects.forEach(d => { defByReason[d.defect_reason_code] = (defByReason[d.defect_reason_code] || 0) + (d.quantity || 0); });
  const maxDef = Math.max(1, ...Object.values(defByReason), totalReject);

  // Per-line performance
  const perLine = state.lines.map(l => {
    const lb = b.filter(x => x.line_id === l.id);
    const good = lb.reduce((s, x) => s + (x.good_quantity || 0), 0);
    const reject = lb.reduce((s, x) => s + (x.defect_reject_quantity || 0), 0);
    const actual = good + reject;
    const ldt = state.downtime.filter(d => lb.some(x => x.id === d.batch_id)).reduce((s, d) => s + (d.duration_minutes || 0), 0);
    return { code: l.line_code, name: l.line_name, batches: lb.length, yieldPct: actual > 0 ? Math.round((good / actual) * 1000) / 10 : null, downtime: Math.round(ldt) };
  }).filter(l => l.batches > 0);
  const maxLineBatches = Math.max(1, ...perLine.map(l => l.batches));

  const statusBars = Object.entries(statusCounts).map(([s, c]) => `
    <div class="bar-row">
      <div class="bar-label">${s}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${totalBatches ? (c / totalBatches) * 100 : 0}%; background:${STATUS_COLOR[s]}"></div></div>
      <div class="bar-val">${c}</div>
    </div>
  `).join('');

  const dtBars = Object.keys(dtByReason).length ? Object.entries(dtByReason).sort((a,b2)=>b2[1]-a[1]).map(([r, mins]) => `
    <div class="bar-row">
      <div class="bar-label">${r}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(mins / maxDt) * 100}%; background:var(--red)"></div></div>
      <div class="bar-val">${Math.round(mins)}m</div>
    </div>
  `).join('') : `<div class="empty" style="padding:16px 0;">No downtime recorded yet.</div>`;

  const defBars = Object.keys(defByReason).length ? Object.entries(defByReason).sort((a,b2)=>b2[1]-a[1]).map(([r, qty]) => `
    <div class="bar-row">
      <div class="bar-label">${r}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(qty / maxDef) * 100}%; background:var(--amber)"></div></div>
      <div class="bar-val">${qty}</div>
    </div>
  `).join('') : `<div class="empty" style="padding:16px 0;">No defects recorded yet.</div>`;

  const lineRows = perLine.length ? perLine.map(l => `
    <tr>
      <td class="mono">${l.code}</td>
      <td class="dim">${l.name}</td>
      <td><span class="mini-bar" style="width:${(l.batches / maxLineBatches) * 40}px"></span>${l.batches}</td>
      <td class="mono">${l.yieldPct === null ? '—' : l.yieldPct + '%'}</td>
      <td class="mono">${l.downtime}m</td>
    </tr>
  `).join('') : `<tr><td colspan="5" class="empty">No batch activity on any line yet.</td></tr>`;

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-desc">Floor-wide rollup across all batches, downtime, and defects.</div>
      </div>
      <button class="btn btn-amber" data-nav="newbatch">+ New Lot</button>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val">${totalBatches}</div><div class="kpi-label">Total Batches</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--blue)">${statusCounts['In Progress']}</div><div class="kpi-label">In Progress</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--red)">${statusCounts['On Hold (QA)']}</div><div class="kpi-label">On QA Hold</div></div>
      <div class="kpi"><div class="kpi-val" style="color:${openDowntime ? 'var(--amber)' : 'var(--text)'}">${openDowntime}</div><div class="kpi-label">Open Downtime</div></div>
      <div class="kpi"><div class="kpi-val">${Math.round(totalDowntimeMin)}<span style="font-size:13px;color:var(--text-faint)">m</span></div><div class="kpi-label">Total Downtime</div></div>
    </div>

    <div class="dash-grid">
      <div>
        <div class="dash-panel">
          <div class="dash-panel-title">Batches by Status</div>
          ${statusBars}
        </div>
        <div class="dash-panel">
          <div class="dash-panel-title">Line Performance <span class="hint">yield = good / (good + reject)</span></div>
          <table class="perf-table">
            <thead><tr><th>Line</th><th>Name</th><th>Batches</th><th>Yield</th><th>Downtime</th></tr></thead>
            <tbody>${lineRows}</tbody>
          </table>
        </div>
      </div>
      <div>
        <div class="dash-panel">
          <div class="dash-panel-title">Yield</div>
          <div class="yield-ring-wrap">
            <div>
              <div class="yield-num" style="color:${yieldPct === null ? 'var(--text-faint)' : yieldPct >= 95 ? 'var(--green)' : yieldPct >= 85 ? 'var(--amber)' : 'var(--red)'}">${yieldPct === null ? '—' : yieldPct + '%'}</div>
              <div class="yield-sub">${totalGood} good / ${totalActual} produced</div>
            </div>
          </div>
          <div style="margin-top:14px; border-top:1px solid var(--border); padding-top:12px;">
            <div class="bar-row" style="margin-bottom:0;">
              <div class="bar-label">Plan attainment</div>
              <div class="bar-track"><div class="bar-fill" style="width:${attainmentPct === null ? 0 : Math.min(attainmentPct,100)}%; background:var(--blue)"></div></div>
              <div class="bar-val">${attainmentPct === null ? '—' : attainmentPct + '%'}</div>
            </div>
          </div>
        </div>
        <div class="dash-panel">
          <div class="dash-panel-title">Downtime by Reason</div>
          ${dtBars}
        </div>
        <div class="dash-panel">
          <div class="dash-panel-title">Defects by Reason</div>
          ${defBars}
        </div>
      </div>
    </div>
  `;
}

function viewBatches() {
  const counts = {};
  ['Not Started', 'In Progress', 'Paused', 'Completed', 'On Hold (QA)'].forEach(s => counts[s] = 0);
  state.batches.forEach(b => counts[b.status] = (counts[b.status] || 0) + 1);

  let filtered = state.batches;
  if (state.filterStatus !== 'all') filtered = filtered.filter(b => b.status === state.filterStatus);
  if (state.filterLine !== 'all') filtered = filtered.filter(b => b.line_id === state.filterLine);

  const kpis = Object.entries(counts).map(([s, c]) => `
    <div class="kpi"><div class="kpi-val" style="color:${STATUS_COLOR[s]}">${c}</div><div class="kpi-label">${s}</div></div>
  `).join('');

  const lineOpts = state.lines.map(l => `<option value="${l.id}" ${state.filterLine === l.id ? 'selected' : ''}>${l.line_code}</option>`).join('');
  const statusOpts = Object.keys(STATUS_COLOR).map(s => `<option value="${s}" ${state.filterStatus === s ? 'selected' : ''}>${s}</option>`).join('');

  // Group batches that share a Lot No into one routing card; batches
  // without a Lot No (legacy/single batches) render individually.
  const lots = {};
  const standalone = [];
  filtered.forEach(b => {
    if (b.lot_no) {
      (lots[b.lot_no] = lots[b.lot_no] || []).push(b);
    } else {
      standalone.push(b);
    }
  });
  Object.values(lots).forEach(arr => arr.sort((a, b) => (a.sequence_no || 0) - (b.sequence_no || 0)));

  const lotCards = Object.entries(lots).map(([lotNo, steps]) => {
    const first = steps[0];
    const doneCount = steps.filter(s => s.status === 'Completed').length;
    return `
    <div class="panel lot-card">
      <div class="lot-header">
        <div>
          <div class="lot-title">Lot ${lotNo}${first.colour ? ` · ${first.colour}` : ''}</div>
          <div class="batch-meta">${productSku(first.product_id)} · Planned <b>${first.planned_quantity}</b> · ${doneCount}/${steps.length} steps complete</div>
        </div>
      </div>
      <div class="lot-steps">${steps.map(batchCardHtml).join('')}</div>
    </div>`;
  }).join('');

  const standaloneCards = standalone.length ? standalone.map(batchCardHtml).join('') : '';

  const nothing = !Object.keys(lots).length && !standalone.length
    ? `<div class="empty">No batches match this filter.</div>` : '';

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Batches</div>
        <div class="page-desc">Live view of every batch across the floor.</div>
      </div>
      <button class="btn btn-amber" data-nav="newbatch">+ New Lot</button>
    </div>
    <div class="kpi-row">${kpis}</div>
    <div class="toolbar">
      <select id="filterStatus"><option value="all">All statuses</option>${statusOpts}</select>
      <select id="filterLine"><option value="all">All lines</option>${lineOpts}</select>
    </div>
    ${nothing}
    ${lotCards}
    ${standaloneCards}
  `;
}

function renderNewLotSteps() {
  const container = document.getElementById('nb_steps');
  if (!container) return;
  const lineOptsFor = (selectedId) => state.lines.filter(l => l.is_active).map(l =>
    `<option value="${l.id}" ${l.id === selectedId ? 'selected' : ''}>${l.line_code} — ${l.line_name}</option>`
  ).join('');
  container.innerHTML = state._newLotSteps.map((lineId, i) => `
    <div class="step-row">
      <span class="step-num">${i + 1}.</span>
      <select data-step-index="${i}">${lineOptsFor(lineId)}</select>
      ${state._newLotSteps.length > 1 ? `<span class="step-remove" data-remove-step="${i}">×</span>` : ''}
    </div>
  `).join('');
  container.querySelectorAll('select[data-step-index]').forEach(sel =>
    sel.addEventListener('change', () => { state._newLotSteps[Number(sel.dataset.stepIndex)] = sel.value; }));
  container.querySelectorAll('[data-remove-step]').forEach(el =>
    el.addEventListener('click', () => { state._newLotSteps.splice(Number(el.dataset.removeStep), 1); renderNewLotSteps(); }));
}

async function createBatch() {
  const productId = document.getElementById('nb_product').value;
  const shift = document.getElementById('nb_shift').value;
  const supervisorId = document.getElementById('nb_supervisor').value;
  const planned = Number(document.getElementById('nb_planned').value) || 0;
  const entryMethod = document.getElementById('nb_entry').value;
  const lotNo = document.getElementById('nb_lotno').value.trim();
  const colour = document.getElementById('nb_colour').value.trim();
  const notes = document.getElementById('nb_notes').value;
  const stepLineIds = state._newLotSteps;

  if (!stepLineIds.length) { toast('Add at least one process step.', 'err'); return; }

  const today = new Date();
  const ymd = today.toISOString().slice(0, 10).replace(/-/g, '');

  const rows = stepLineIds.map((lineId, i) => {
    const line = state.lines.find(l => l.id === lineId);
    const seq = i + 1;
    const batchCode = lotNo
      ? `${lotNo}-${String(seq).padStart(2, '0')}-${line ? line.line_code : 'LN'}`
      : `${line ? line.line_code : 'LN'}-${shift[0]}-${ymd}-${String(seq).padStart(3, '0')}`;
    return {
      batch_code: batchCode,
      product_id: productId,
      line_id: lineId,
      shift,
      planned_quantity: planned,
      assigned_supervisor_id: supervisorId,
      entry_method: entryMethod,
      lot_no: lotNo || null,
      colour: colour || null,
      sequence_no: seq,
      notes,
    };
  });

  const { error } = await sb.from('batches').insert(rows);

  if (error) { toast('Create failed: ' + error.message, 'err'); return; }
  toast(lotNo ? `Lot ${lotNo} created with ${rows.length} step${rows.length > 1 ? 's' : ''}.` : `Batch created.`);
  state._newLotSteps = null;
  state.route = 'batches';
  await loadAll();
}

// ------------------------------------------------------------------
// Batch status transition + qty update
// ------------------------------------------------------------------
async function updateStatus(id, to) {
  const payload = { status: to };
  const batch = state.batches.find(b => b.id === id);
  if (to === 'In Progress' && batch.status === 'Not Started' && !batch.start_timestamp) {
    payload.start_timestamp = new Date().toISOString();
  }
  const { error } = await sb.from('batches').update(payload).eq('id', id);
  if (error) { toast('Status update failed: ' + error.message, 'err'); return; }
  toast(`Batch → ${to}`);
  await loadAll();
}

function openQtyModal(id) {
  const b = state.batches.find(x => x.id === id);
  const backdrop = document.getElementById('modalBackdrop');
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-title">Update Quantities — ${b.batch_code}</div>
    <div class="field"><label>Good Quantity</label><input id="mq_good" type="number" min="0" style="width:100%" value="${b.good_quantity}"></div>
    <div class="field"><label>Defect / Reject Quantity</label><input id="mq_reject" type="number" min="0" style="width:100%" value="${b.defect_reject_quantity}"></div>
    <div class="field"><label>Defect Reason (if any)</label>
      <select id="mq_reason" style="width:100%">
        <option value="">—</option>
        <option>Material</option><option>Machine</option><option>Process</option><option>Operator</option><option>Other</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="mq_cancel">Cancel</button>
      <button class="btn btn-amber" id="mq_save" data-id="${id}">Save</button>
    </div>
  `;
  if (b.defect_reason_code) document.getElementById('mq_reason').value = b.defect_reason_code;
  backdrop.classList.add('show');
  document.getElementById('mq_cancel').onclick = () => backdrop.classList.remove('show');
  document.getElementById('mq_save').onclick = async () => {
    const good = Number(document.getElementById('mq_good').value) || 0;
    const reject = Number(document.getElementById('mq_reject').value) || 0;
    const reason = document.getElementById('mq_reason').value || null;
    const { error } = await sb.from('batches').update({
      good_quantity: good,
      defect_reject_quantity: reject,
      actual_quantity_produced: good + reject,
      defect_reason_code: reason,
    }).eq('id', id);
    if (error) { toast('Update failed: ' + error.message, 'err'); return; }
    backdrop.classList.remove('show');
    toast('Quantities updated.');
    await loadAll();
  };
}

// ------------------------------------------------------------------
// VIEW: Downtime
// ------------------------------------------------------------------
function viewDowntime() {
  const openBatches = state.batches.filter(b => ['In Progress', 'Paused'].includes(b.status));
  const batchOpts = openBatches.map(b => `<option value="${b.id}">${b.batch_code}</option>`).join('');
  const userOpts = state.users.filter(u => u.status === 'Active').map(u => `<option value="${u.id}">${u.name}</option>`).join('');

  const rows = state.downtime.length ? state.downtime.map(d => `
    <tr>
      <td class="mono">${batchCode(d.batch_id)}</td>
      <td>${d.downtime_reason}</td>
      <td class="mono dim">${fmtDate(d.start_time)}</td>
      <td class="mono dim">${d.end_time ? fmtDate(d.end_time) : '<span style="color:var(--amber)">ongoing</span>'}</td>
      <td class="mono">${d.duration_minutes ? Math.round(d.duration_minutes) + ' min' : '—'}</td>
      <td>${userName(d.logged_by)}</td>
      <td>${!d.end_time ? `<button class="btn btn-sm" data-action="closedt" data-id="${d.id}">Close</button>` : ''}</td>
    </tr>
  `).join('') : `<tr><td colspan="7" class="empty">No downtime events logged yet.</td></tr>`;

  return `
    <div class="page-head">
      <div><div class="page-title">Downtime Log</div><div class="page-desc">One open event per batch — starting a new one closes any existing open event.</div></div>
    </div>
    <div class="panel" style="padding:20px; margin-bottom:24px; max-width:720px;">
      <div class="grid2">
        <div class="field"><label>Batch</label><select id="dt_batch" style="width:100%">${batchOpts || '<option disabled>No active batches</option>'}</select></div>
        <div class="field"><label>Reason</label>
          <select id="dt_reason" style="width:100%">
            <option>Machine Breakdown</option><option>Material Shortage</option><option>Changeover</option><option>Break</option><option>Other</option>
          </select>
        </div>
        <div class="field"><label>Logged By</label><select id="dt_user" style="width:100%">${userOpts}</select></div>
      </div>
      <button class="btn btn-amber" id="dt_submit" ${!openBatches.length ? 'disabled' : ''}>Log Downtime Start</button>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Batch</th><th>Reason</th><th>Start</th><th>End</th><th>Duration</th><th>Logged By</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function logDowntimeStart() {
  const batchId = document.getElementById('dt_batch').value;
  const reason = document.getElementById('dt_reason').value;
  const loggedBy = document.getElementById('dt_user').value;
  if (!batchId || !loggedBy) { toast('Select a batch and user.', 'err'); return; }

  // Auto-close any open event on this batch first (per overlap-handling rule)
  await sb.from('downtime_events').update({ end_time: new Date().toISOString() })
    .eq('batch_id', batchId).is('end_time', null);

  const { error } = await sb.from('downtime_events').insert({
    batch_id: batchId, downtime_reason: reason, start_time: new Date().toISOString(), logged_by: loggedBy,
  });
  if (error) { toast('Log failed: ' + error.message, 'err'); return; }
  toast('Downtime started.');
  await loadAll();
}

async function closeDowntime(id) {
  const { error } = await sb.from('downtime_events').update({ end_time: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Close failed: ' + error.message, 'err'); return; }
  toast('Downtime closed.');
  await loadAll();
}

// ------------------------------------------------------------------
// VIEW: Defects
// ------------------------------------------------------------------
function viewDefects() {
  const batchOpts = state.batches.map(b => `<option value="${b.id}">${b.batch_code}</option>`).join('');
  const userOpts = state.users.filter(u => u.status === 'Active').map(u => `<option value="${u.id}">${u.name}</option>`).join('');

  const rows = state.defects.length ? state.defects.map(d => `
    <tr>
      <td class="mono">${batchCode(d.batch_id)}</td>
      <td>${d.defect_reason_code}</td>
      <td class="mono">${d.quantity}</td>
      <td class="mono dim">${fmtDate(d.occurred_at)}</td>
      <td>${userName(d.logged_by)}</td>
      <td class="dim">${d.notes || ''}</td>
    </tr>
  `).join('') : `<tr><td colspan="6" class="empty">No defects logged yet.</td></tr>`;

  return `
    <div class="page-head">
      <div><div class="page-title">Defect Log</div><div class="page-desc">Itemized, time-stamped defects — feeds each batch's rolled-up reject total.</div></div>
    </div>
    <div class="panel" style="padding:20px; margin-bottom:24px; max-width:720px;">
      <div class="grid2">
        <div class="field"><label>Batch</label><select id="df_batch" style="width:100%">${batchOpts}</select></div>
        <div class="field"><label>Reason</label>
          <select id="df_reason" style="width:100%">
            <option>Material</option><option>Machine</option><option>Process</option><option>Operator</option><option>Other</option>
          </select>
        </div>
        <div class="field"><label>Quantity</label><input id="df_qty" type="number" min="1" value="1" style="width:100%"></div>
        <div class="field"><label>Logged By</label><select id="df_user" style="width:100%">${userOpts}</select></div>
      </div>
      <div class="field"><label>Notes</label><input id="df_notes" style="width:100%"></div>
      <button class="btn btn-amber" id="df_submit" ${!state.batches.length ? 'disabled' : ''}>Log Defect</button>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Batch</th><th>Reason</th><th>Qty</th><th>Occurred</th><th>Logged By</th><th>Notes</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function logDefect() {
  const batchId = document.getElementById('df_batch').value;
  const reason = document.getElementById('df_reason').value;
  const qty = Number(document.getElementById('df_qty').value) || 0;
  const loggedBy = document.getElementById('df_user').value;
  const notes = document.getElementById('df_notes').value;
  if (!batchId || !loggedBy || qty <= 0) { toast('Select batch, user, and a quantity > 0.', 'err'); return; }

  const { error: e1 } = await sb.from('defect_log').insert({
    batch_id: batchId, defect_reason_code: reason, quantity: qty, logged_by: loggedBy, notes,
  });
  if (e1) { toast('Log failed: ' + e1.message, 'err'); return; }

  // Roll up onto the batch totals
  const b = state.batches.find(x => x.id === batchId);
  const newReject = b.defect_reject_quantity + qty;
  const { error: e2 } = await sb.from('batches').update({
    defect_reject_quantity: newReject,
    actual_quantity_produced: b.good_quantity + newReject,
    defect_reason_code: reason,
  }).eq('id', batchId);
  if (e2) { toast('Batch rollup failed: ' + e2.message, 'err'); return; }

  toast('Defect logged.');
  await loadAll();
}

// ------------------------------------------------------------------
// VIEW: Masters (Products / Lines / Users)
// ------------------------------------------------------------------
function viewMasters() {
  state._mastersTab = state._mastersTab || 'products';
  const tab = state._mastersTab;
  const isManager = state.currentUser && state.currentUser.role === 'Manager';

  const tabs = ['products', 'lines', 'users'].map(t =>
    `<div class="tab ${tab === t ? 'active' : ''}" data-mtab="${t}">${t[0].toUpperCase() + t.slice(1)}</div>`
  ).join('');

  const managerNotice = `<div class="panel empty" style="margin-bottom:20px; max-width:680px;">Only Managers can add or edit master data here. You're signed in as <b style="color:var(--text)">${state.currentUser ? state.currentUser.role : '—'}</b>.</div>`;

  let body = '';
  if (tab === 'products') {
    const rows = state.products.map(p => `
      <tr><td class="mono">${p.sku}</td><td>${p.product_name}</td><td class="mono">${p.standard_cycle_time}</td>
      <td>${p.is_active ? '<span style="color:var(--green)">Active</span>' : '<span class="dim">Inactive</span>'}</td></tr>
    `).join('') || `<tr><td colspan="4" class="empty">No products yet.</td></tr>`;
    body = `
      ${isManager ? `
      <div class="panel" style="padding:18px; margin-bottom:20px; max-width:680px;">
        <div class="grid2">
          <div class="field"><label>SKU</label><input id="pm_sku" style="width:100%"></div>
          <div class="field"><label>Product Name</label><input id="pm_name" style="width:100%"></div>
          <div class="field"><label>Standard Cycle Time</label><input id="pm_cycle" type="number" step="0.01" style="width:100%"></div>
        </div>
        <button class="btn btn-amber" id="pm_submit">Add Product</button>
      </div>` : managerNotice}
      <div class="panel"><table><thead><tr><th>SKU</th><th>Name</th><th>Cycle Time</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    `;
  } else if (tab === 'lines') {
    const rows = state.lines.map(l => `
      <tr><td class="mono">${l.line_code}</td><td>${l.line_name}</td><td class="dim">${l.facility || '—'}</td>
      <td>${l.is_active ? '<span style="color:var(--green)">Active</span>' : '<span class="dim">Inactive</span>'}</td></tr>
    `).join('') || `<tr><td colspan="4" class="empty">No lines yet.</td></tr>`;
    body = `
      ${isManager ? `
      <div class="panel" style="padding:18px; margin-bottom:20px; max-width:680px;">
        <div class="grid2">
          <div class="field"><label>Line Code</label><input id="lm_code" style="width:100%" placeholder="e.g. L3"></div>
          <div class="field"><label>Line Name</label><input id="lm_name" style="width:100%"></div>
          <div class="field"><label>Facility</label><input id="lm_facility" style="width:100%"></div>
        </div>
        <button class="btn btn-amber" id="lm_submit">Add Line</button>
      </div>` : managerNotice}
      <div class="panel"><table><thead><tr><th>Code</th><th>Name</th><th>Facility</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    `;
  } else {
    const rows = state.users.map(u => `
      <tr><td>${u.name}</td><td class="mono">${u.employee_id}</td><td>${u.role}</td>
      <td>${u.status === 'Active' ? '<span style="color:var(--green)">Active</span>' : '<span class="dim">Inactive</span>'}</td>
      <td>${u.auth_user_id ? '<span style="color:var(--green)">Linked</span>' : '<span class="dim">No login yet</span>'}</td></tr>
    `).join('') || `<tr><td colspan="5" class="empty">No users yet.</td></tr>`;
    const roleOpts = ROLE_OPTIONS.map(r => `<option>${r}</option>`).join('');
    body = `
      ${isManager ? `
      <div class="panel" style="padding:18px; margin-bottom:20px; max-width:680px;">
        <div class="grid3">
          <div class="field"><label>Name</label><input id="um_name" style="width:100%"></div>
          <div class="field"><label>Employee ID</label><input id="um_empid" style="width:100%"></div>
          <div class="field"><label>Role</label><select id="um_role" style="width:100%">${roleOpts}</select></div>
        </div>
        <button class="btn btn-amber" id="um_submit">Add Placeholder Employee</button>
        <div class="auth-hint">Creates a record with no login yet — the employee links it by signing up with the same Employee ID.</div>
      </div>` : managerNotice}
      <div class="panel"><table><thead><tr><th>Name</th><th>Employee ID</th><th>Role</th><th>Status</th><th>Login</th></tr></thead><tbody>${rows}</tbody></table></div>
    `;
  }

  return `
    <div class="page-head"><div><div class="page-title">Setup</div><div class="page-desc">Master data — products, lines, and users referenced everywhere else.</div></div></div>
    <div class="tab-row">${tabs}</div>
    ${body}
  `;
}

async function addProduct() {
  const sku = document.getElementById('pm_sku').value.trim();
  const name = document.getElementById('pm_name').value.trim();
  const cycle = Number(document.getElementById('pm_cycle').value) || 0;
  if (!sku || !name) { toast('SKU and name are required.', 'err'); return; }
  const { error } = await sb.from('products').insert({ sku, product_name: name, standard_cycle_time: cycle });
  if (error) { toast('Add failed: ' + error.message, 'err'); return; }
  toast('Product added.'); await loadAll();
}
async function addLine() {
  const code = document.getElementById('lm_code').value.trim();
  const name = document.getElementById('lm_name').value.trim();
  const facility = document.getElementById('lm_facility').value.trim();
  if (!code || !name) { toast('Line code and name are required.', 'err'); return; }
  const { error } = await sb.from('lines').insert({ line_code: code, line_name: name, facility });
  if (error) { toast('Add failed: ' + error.message, 'err'); return; }
  toast('Line added.'); await loadAll();
}
async function addUser() {
  const name = document.getElementById('um_name').value.trim();
  const empId = document.getElementById('um_empid').value.trim();
  const role = document.getElementById('um_role').value;
  if (!name || !empId) { toast('Name and employee ID are required.', 'err'); return; }
  const { error } = await sb.from('app_users').insert({ name, employee_id: empId, role, login_identifier: empId });
  if (error) { toast('Add failed: ' + error.message, 'err'); return; }
  toast('Placeholder employee added.'); await loadAll();
}

// ------------------------------------------------------------------
// Event wiring
// ------------------------------------------------------------------
function attachHandlers() {
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => { state.route = el.dataset.nav; render(); }));

  const fs = document.getElementById('filterStatus');
  if (fs) fs.addEventListener('change', () => { state.filterStatus = fs.value; render(); });
  const fl = document.getElementById('filterLine');
  if (fl) fl.addEventListener('change', () => { state.filterLine = fl.value; render(); });

  document.querySelectorAll('[data-action="status"]').forEach(el =>
    el.addEventListener('click', (e) => { if (el.dataset.stop) e.stopPropagation(); updateStatus(el.dataset.id, el.dataset.to); }));
  document.querySelectorAll('[data-action="editqty"]').forEach(el =>
    el.addEventListener('click', (e) => { if (el.dataset.stop) e.stopPropagation(); openQtyModal(el.dataset.id); }));
  document.querySelectorAll('[data-action="closedt"]').forEach(el =>
    el.addEventListener('click', (e) => { e.stopPropagation(); closeDowntime(el.dataset.id); }));
  document.querySelectorAll('[data-action="viewbatch"]').forEach(el =>
    el.addEventListener('click', (e) => { e.stopPropagation(); state.selectedBatchId = el.dataset.id; state.route = 'batchdetail'; render(); }));

  const nbSubmit = document.getElementById('nb_submit');
  if (nbSubmit) nbSubmit.addEventListener('click', createBatch);
  const nbAddStep = document.getElementById('nb_addstep');
  if (nbAddStep) nbAddStep.addEventListener('click', () => {
    state._newLotSteps.push(state.lines[0]?.id);
    renderNewLotSteps();
  });
  const dtSubmit = document.getElementById('dt_submit');
  if (dtSubmit) dtSubmit.addEventListener('click', logDowntimeStart);
  const dfSubmit = document.getElementById('df_submit');
  if (dfSubmit) dfSubmit.addEventListener('click', logDefect);

  document.querySelectorAll('[data-mtab]').forEach(el =>
    el.addEventListener('click', () => { state._mastersTab = el.dataset.mtab; render(); }));
  const pmSubmit = document.getElementById('pm_submit');
  if (pmSubmit) pmSubmit.addEventListener('click', addProduct);
  const lmSubmit = document.getElementById('lm_submit');
  if (lmSubmit) lmSubmit.addEventListener('click', addLine);
  const umSubmit = document.getElementById('um_submit');
  if (umSubmit) umSubmit.addEventListener('click', addUser);
}

// ------------------------------------------------------------------
// Boot
// ------------------------------------------------------------------
sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    showApp();
    loadAll().catch(err => toast('Failed to reach Supabase: ' + err.message, 'err'));
  } else {
    state.currentUser = null;
    showAuthScreen();
  }
});
</script>
